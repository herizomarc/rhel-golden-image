stages:
  - build
  - deploy

variables:
  BLUEPRINT_NAME: "rhel9-proxmox-minimal-base"
  VM_TEMPLATE_ID: "9000"
  PVE_HOST: "10.10.99.2"
  # Optimized: Targeted directly onto the dedicated space to prevent disk saturation
  SHARED_DIR: "/var/lib/gitlab-runner/share" 

build_image:
  stage: build
  tags:
    - image-builder # Targets your dedicated RHEL 9.8 VM Runner
  script:
    - 'echo "=== 1. PREREQUISITES: Initializing and cleaning up the local shared directory ==="'
    # Smart directory management: Create if missing, empty if present inside your dedicated partition
    - |
      if [ ! -d "${SHARED_DIR}" ]; then
        echo "Shared directory does not exist. Creating it on dedicated partition..."
        sudo mkdir -p "${SHARED_DIR}"
        sudo chown -R gitlab-runner:gitlab-runner "${SHARED_DIR}"
      else
        echo "Shared directory already exists. Ensuring it is completely empty..."
        if [ "$(ls -A ${SHARED_DIR} 2>/dev/null)" ]; then
          echo "Stale files discovered inside the shared directory. Purging them..."
          sudo rm -rf ${SHARED_DIR}/*
        else
          echo "Shared directory is already empty."
        fi
      fi
    - rm -f build.env
    
    # Clean leftover tracking from old runs to save space
    - |
      FINISHED_UUIDS=$(sudo composer-cli compose status | grep -E "FINISHED|FAILED" | awk '{print $1}' || true)
      for uuid in $FINISHED_UUIDS; do
        if [ ! -z "$uuid" ]; then
          echo "Purging old tracking ID: $uuid"
          sudo composer-cli compose delete "$uuid" || true
          sudo rm -rf "/var/lib/osbuild-composer/artifacts/$uuid" || true
        fi
      done

    # Safety trigger: Cancel any zombie build stuck in RUNNING state
    - |
      RUNNING_UUID=$(sudo composer-cli compose status | grep "${BLUEPRINT_NAME}" | grep "RUNNING" | awk '{print $1}' || true)
      if [ ! -z "$RUNNING_UUID" ]; then
        echo "Warning: A build is already running with UUID $RUNNING_UUID. Canceling..."
        sudo composer-cli compose cancel "$RUNNING_UUID" || true
        sleep 5
      fi

    - 'echo "=== 2. NATIVE IMAGE BUILD START ==="'
    - sudo composer-cli blueprints push blueprint.toml
    
    - echo "Starting the native compilation process (QCOW2 disk appliance format)..."
    - COMPOSE_UUID=$(sudo composer-cli compose start ${BLUEPRINT_NAME} qcow2 | awk '{print $2}')
    - echo "Build initialized. Tracking UUID = $COMPOSE_UUID"
    
    # Smart wait-loop ($2 extracts RUNNING/FINISHED states)
    - |
      while true; do
        STATUS=$(sudo composer-cli compose status | grep "$COMPOSE_UUID" | awk '{print $2}')
        echo "Current status: $STATUS"
        if [ "$STATUS" = "FINISHED" ]; then
          break
        elif [ "$STATUS" = "FAILED" ]; then
          echo "Error: OS compilation failed."
          exit 1
        fi
        sleep 20
      done

    - 'echo "=== 3. LOCAL IMAGE EXTRACTION & STAGING ==="'
    # Extracts the file seamlessly via the official utility
    - sudo composer-cli compose image "$COMPOSE_UUID"
    
    # Identify and rename the dynamically named file
    - EXTRACTED_FILE=$(ls | grep "${COMPOSE_UUID}" | grep -E "qcow2|tar" | head -n 1)
    - sudo mv "${EXTRACTED_FILE}" image-output.qcow2
    - sudo chown gitlab-runner:gitlab-runner image-output.qcow2
    
    # Persist data onto the safe, heavy-disk partition
    - echo "COMPOSE_UUID=$COMPOSE_UUID" > build.env
    - cp build.env "${SHARED_DIR}/build.env"
    - mv image-output.qcow2 "${SHARED_DIR}/image-output.qcow2"
    - echo "Build job completed successfully. File stored on the dedicated partition."
  only:
    - main

deploy_template:
  stage: deploy
  tags:
    - image-builder
  dependencies: []
  before_script:
    - sudo dnf install -y openssh-clients
  script:
    - 'echo "=== 4. RETRIEVING LOCALLY STAGED FILE ==="'
    # Load variables and extract the heavy file from the dedicated path
    - if [ -f "${SHARED_DIR}/build.env" ]; then source "${SHARED_DIR}/build.env"; fi
    - mv "${SHARED_DIR}/image-output.qcow2" ./image-output.qcow2
    - sudo chown gitlab-runner:gitlab-runner image-output.qcow2
    - sudo chmod 644 image-output.qcow2

    - 'echo "=== 5. PROXMOX TRANSFER ==="'
    - scp -o StrictHostKeyChecking=no image-output.qcow2 root@${PVE_HOST}:/tmp/rhel-base.qcow2
    
    - 'echo "=== 6. PROXMOX AUTOMATED ORCHESTRATION ==="'
    - |
      ssh -o StrictHostKeyChecking=no root@${PVE_HOST} "
        qm destroy ${VM_TEMPLATE_ID} --destroy-unreferenced-disks 1 || true
        qm create ${VM_TEMPLATE_ID} --name 'rhel9-base-template' --memory 2048 --cores 2 --net0 virtio,bridge=vmbr0 --scsihw virtio-scsi-pci
        qm importdisk ${VM_TEMPLATE_ID} /tmp/rhel-base.qcow2 local-lvm
        qm set ${VM_TEMPLATE_ID} --scsi0 local-lvm:vm-${VM_TEMPLATE_ID}-disk-0
        qm set ${VM_TEMPLATE_ID} --ide2 local-lvm:cloudinit
        qm set ${VM_TEMPLATE_ID} --boot order=scsi0
        qm set ${VM_TEMPLATE_ID} --agent 1
        qm set ${VM_TEMPLATE_ID} --cicustom 'user=local:snippets/rhsm.yml'
        qm template ${VM_TEMPLATE_ID}
        rm -f /tmp/rhel-base.qcow2
      "
    - 'echo "Success! The RHEL 9 Golden Image (ID ${VM_TEMPLATE_ID}) is active on Proxmox."'
  after_script:
    - 'echo "=== 7. POST-DEPLOYMENT FINAL SYSTEM PURGE ==="'
    - if [ -f "${SHARED_DIR}/build.env" ]; then source "${SHARED_DIR}/build.env"; fi
    
    # Aggressively wipe the internal root-owned cache folders to keep the host lean
    - |
      if [ ! -z "$COMPOSE_UUID" ]; then
        echo "Performing ultimate system cache purge for task: $COMPOSE_UUID"
        INTERNAL_DIR=$(sudo find /var/lib/osbuild-composer/artifacts/ -maxdepth 1 -type d | grep -v "artifacts/$" | head -n 1 || true)
        sudo composer-cli compose delete "$COMPOSE_UUID" || true
        if [ ! -z "${INTERNAL_DIR}" ]; then
          sudo rm -rf "${INTERNAL_DIR}" || true
        fi
      fi
    # Wipe the dedicated shared workspace cleanly
    - sudo rm -rf "${SHARED_DIR}"
    - rm -f *.qcow2 build.env
  only:
    - main
